kcp_version: '0.14'
project: merkabit-paper8-klein-quartic
description: >
  Paper 8 of the Merkabit series: "The Klein Quartic Connection". Establishes that the {3,7} tiling of the Klein quartic —
  a genus-3 Riemann surface with PSL(2,7) automorphism group (168 elements) — forms the fundamental domain for the merkabit
  phase space. Includes analysis of azygetic graph structure, vertex bijection with PSL(2,7), cyclotomic field connections
  to the merkabit constant α, and theta function analysis.
